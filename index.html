<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transformation visuals</title>   
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer">
        <div class="s scaleX">scaleX</div>
        <div class="s scaleY">scaley</div>
        <div class="s scale">scale</div>
        <div class="s translateX">translateX</div>
        <div class="s translateY">translateY</div>
        <div class="s translateZ">translateZ</div>
        <div class="s translate">translate</div>
        <div class="s matrix">matrix</div>
        <div class="s rotate">rotate</div>
        <div class="s skew">skew</div>
        <div class="s skewX">skewX</div>
        <div class="s skewY">skewY</div>
        <div class="s matrix3d">matrix3d</div>
        <div class="s translate3d">translate3d</div>
        <div class="s rotateY">rotateY</div>
        <div class="s rotateX">rotateX</div>
    </div>
</body>
</html>
